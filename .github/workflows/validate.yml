name: Validate ZeroDay Radar
on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax checks
        run: python -m py_compile scripts/collect.py scripts/intelligence_history.py scripts/prioritisation.py
      - name: JavaScript syntax check
        run: |
          node --check app.js
          node --check alerts.js
