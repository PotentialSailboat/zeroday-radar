name: Update threat intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: intelligence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect-and-deploy:
    # Scheduled workflows run on the default branch. Manual dev runs validate data,
    # but must never publish the public production Pages site.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Collect intelligence
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_ENRICH_LIMIT: '15'
          SITE_URL: https://potentialsailboat.github.io/zeroday-radar/
        run: python scripts/collect.py
      - name: Verify generated files
        run: |
          python -m json.tool data/vulnerabilities.json > /dev/null
          python -m json.tool data/history.json > /dev/null
          python -m json.tool data/alerts.json > /dev/null
          python -m json.tool data/emerging.json > /dev/null
          python -m json.tool data/priorities.json > /dev/null
          python -c "import xml.etree.ElementTree as ET; ET.parse('feed.xsl')"
          python -c "import xml.etree.ElementTree as ET; ET.parse('feed.xml')"
      - name: Commit dataset on main only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vulnerabilities.json data/history.json data/alerts.json data/emerging.json data/priorities.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh intelligence and RSS alerts'
            git push
          fi
      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{ github.token }}
